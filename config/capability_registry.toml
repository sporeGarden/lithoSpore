#
# Capability Registry — lithoSpore
#
# Every JSON-RPC method string used in lithoSpore source code and
# referenced in graph TOML files must appear here. Mirrors the
# primalSpring canonical registry (445 methods, Wave 35).
#
# Structure: [domain] with `methods = [...]` and `owner` naming the
# primal that serves them. lithoSpore itself consumes these methods
# as a client — it never serves them.
#
# Method Stability Tiers (per primalSpring Wave 20, May 17 2026):
#   stable    — wire name frozen; safe to hardcode in dispatch maps
#   evolving  — may change between major waves; document dependency
#   internal  — test fixture or internal-only; no stability guarantee
#
# Signal tiers: Where applicable, `signal` names the atomic signal
# that collapses the method sequence (per SIGNAL_ADOPTION_STANDARD).
#
# CI: cargo test validates that discovery.rs method strings match
# this registry (Tier 1 structural check).

# ─── Health triad (Deployment Validation Standard v1.1) ──────────────

[health]
owner = "all"
stability = "stable"
consumed_by = "litho-core::discovery (indirect — primals respond to health probes)"
methods = [
    "health.liveness",
    "health.readiness",
    "health.check",
]

# ─── Lifecycle / registration (Wave 17 signal elevation) ─────────────

[lifecycle]
owner = "biomeos"
stability = "stable"
consumed_by = "litho-core::discovery"
methods = [
    "primal.announce",
    "primal.info",
    "primal.list",
]

# ─── Capability discovery ────────────────────────────────────────────

[capabilities]
owner = "all"
stability = "stable"
consumed_by = "litho-core::discovery"
methods = [
    "capability.discover",
    "capability.list",
]

[discovery]
owner = "songbird"
stability = "stable"
consumed_by = "litho-core::discovery"
methods = [
    "discovery.discover",
    "discovery.find_primals",
]

[ipc]
owner = "songbird"
stability = "stable"
consumed_by = "litho-core::discovery"
methods = [
    "ipc.resolve",
]

# ─── Visualization ───────────────────────────────────────────────────

[visualization]
owner = "petaltongue"
stability = "stable"
consumed_by = "ltee-cli::visualize"
methods = [
    "visualization.render",
    "visualization.render.dashboard",
    "visualization.render.stream",
    "visualization.session.create",
]

# ─── Provenance trio ─────────────────────────────────────────────────
# Signal: nest.store collapses dag + spine + braid + storage into one
# Signal: nest.commit finalizes a provenance session

[dag]
owner = "rhizocrypt"
stability = "stable"
consumed_by = "litho-core::provenance"
signal = "nest.store"
methods = [
    "dag.event.append",
    "dag.session.complete",
    "dag.session.create",
]

[spine]
owner = "loamspine"
stability = "stable"
consumed_by = "litho-core::provenance"
signal = "nest.store"
methods = [
    "spine.create",
    "entry.append",
]

[braid]
owner = "sweetgrass"
stability = "stable"
consumed_by = "litho-core::provenance"
signal = "nest.store"
methods = [
    "braid.create",
    "braid.commit",
]

[storage]
owner = "nestgate"
stability = "stable"
consumed_by = "ltee-cli::verify"
signal = "nest.store"
methods = [
    "storage.store",
]

# ─── Security ────────────────────────────────────────────────────────

[crypto]
owner = "beardog"
stability = "stable"
consumed_by = "litho-core::provenance (indirect — trio delegates signing to bearDog)"
note = "P0-A resolved (Wave 157e). bearDog sign surface shipped. Spine commits now signed on westGate."
methods = [
    "crypto.hash",
    "crypto.sign",
    "crypto.verify",
]

# ─── Compute (graph references) ─────────────────────────────────────

[compute]
owner = "toadstool"
stability = "evolving"
consumed_by = "graphs/ltee_guidestone.toml"
signal = "node.compute"
methods = [
    "compute.dispatch",
    "compute.status",
]

# ─── lithoSpore own methods (announced via primal.announce) ──────────

[validation]
owner = "lithospore"
stability = "stable"
consumed_by = "biomeOS mesh (announced to orchestration)"
methods = [
    "validate.run",
    "validate.parity",
    "validate.verify",
]

# ─── Gossip injection points (Wave 157e — ant colony activation) ─────
#
# Events lithoSpore SHOULD announce to the mesh via swarmVine when
# gossip enmeshment is live. These are fire-and-forget publications;
# lithoSpore does not depend on gossip for correctness (graceful
# degradation — standalone mode works without swarmVine).
#
# Injection is gated behind `discover("gossip")` — zero-cost when
# swarmVine is absent.

[gossip_injection]
owner = "lithospore"
stability = "evolving"
note = "Not yet wired — specification only. Activate when swarmVine gossip mesh is enmeshed (TCP 7800)."
events = [
    # After a full validation run completes (any exit code).
    # Payload: artifact, version, tier_reached, pass/fail/partial, module count.
    "validation.complete",
    # When a new pseudoSpore directory is emitted via `litho emit-pseudospore`.
    # Payload: spore_name, scope hash, module count.
    "pseudospore.emitted",
    # When a pseudoSpore is promoted from PENDING to COMPLETE.
    # Payload: spore_name, modules_passing, modules_total.
    "pseudospore.promoted",
    # When a cross-tier parity check completes.
    # Payload: artifact, version, parity_pass (bool), divergence count.
    "parity.checked",
]

# ─── Test fixtures ───────────────────────────────────────────────────

[test_fixtures]
owner = "tests"
stability = "internal"
methods = [
    "test.method",
    "health.test",
]

# ─── False positives (dotted strings that are not methods) ────────────

[false_positives]
owner = "none"
methods = [
    "index.html",
    "data.toml",
    "scope.toml",
    "tolerances.toml",
    "liveSpore.json",
]
